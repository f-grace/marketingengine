# Accounts to track.
#
# Copy this file to config/accounts.yml and fill it in.
# Handles only, with or without the leading @.

# Your own TikTok account. Winners here get an `own_rebrand` recreation
# prompt: same layout and hook, fresh wording, swapped logos/branding.
own:
  - your_handle_here

# Source accounts: competitors plus any account in the space worth mining for
# ideas. Every non-own account is treated the same way: viral single-image
# posts get a `source_recreate` prompt that rebuilds the concept in your voice.
#
# Pick 8-12. Fewer than that and the single-image cohort is too thin to rank
# (the pipeline will warn). Choose accounts whose AUDIENCE overlaps yours, not
# whose product does; the point is learning what that audience responds to.
sources:
  - source_account_one
  - source_account_two
  - source_account_three

scrape:
  # Posts per account per run.
  #
  # Deliberately low to start. The actor bills ~$3.70 per 1,000 results and the
  # Apify free tier is $5/month, so a 10-account x 100-post sweep is 1,000
  # results = $3.70, i.e. most of a month's credit in a single run.
  #
  # Validate the setup at 50, confirm the ingest looks right, then scale up.
  results_per_page: 50

  # How far back to look. Format cycles turn over in roughly three weeks, so
  # anything much older than this is archaeology.
  # NOTE: the actor types this as a plain string without documenting the
  # accepted format. Verify in Apify Console before trusting the relative form.
  oldest_post_date: "60 days"

  proxy_country_code: "US"

  # Selection sizes over the single-image cohort. Losers and anomalies default
  # to 0: the engine's only output is recreation prompts for high performers.
  n_winners: 30
  n_losers: 0
  n_anomalies: 0

  # High reach, low engagement. Formats that travel but do not stick — still
  # worth recreating for reach.
  n_reach_only: 8
